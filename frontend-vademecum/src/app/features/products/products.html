<div class="page-header">
  <h1>Gestión de Productos</h1>
  <button class="add-btn" (click)='openCreateModal()'>+ Nuevo Producto</button>
</div>

<div class="table-container" *ngIf="!isLoading()">
  <table>
    <thead>
      <tr>
        <th>Nombre Comercial</th>
        <th>Genérico</th>
        <th>Familia</th>
        <th>Estado</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let product of products()">
        <td>{{ product.commercial_name }}</td>
        <td>{{ product.generic_name }}</td>
        <td>{{ getFamilyName(product.id_family) }}</td>
        <td>
          <span class="status-badge" [class.active]="product.is_active">
            {{ product.is_active ? 'Activo' : 'Inactivo' }}
          </span>
        </td>
        <td class="actions">
          <button class="edit-btn" (click)="openEditModal(product)">✏️</button>
          <button class="delete-btn" (click)="deleteProduct(product.id_product)">🗑️</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<!-- Modal -->
<div class="modal-overlay" *ngIf="isModalOpen()">
  <div class="modal-content">
    <h2>{{ isEditing() ? 'Editar Producto' : 'Nuevo Producto' }}</h2>
    <form (ngSubmit)="saveProduct()" #productForm="ngForm">
      <div class="form-grid">
        <div class="form-group">
          <label>Nombre Comercial</label>
          <input type="text" name="commercial_name" [(ngModel)]="currentProduct.commercial_name" required>
        </div>
        <div class="form-group">
          <label>Nombre Genérico</label>
          <input type="text" name="generic_name" [(ngModel)]="currentProduct.generic_name">
        </div>
        <div class="form-group">
          <label>Familia</label>
          <select name="id_family" [(ngModel)]="currentProduct.id_family" required>
            <option *ngFor="let f of families()" [value]="f.id_family">{{ f.name }}</option>
          </select>
        </div>
        <div class="form-group">
          <label>Laboratorio</label>
          <select name="id_laboratory" [(ngModel)]="currentProduct.id_laboratory">
            <option *ngFor="let l of laboratories()" [value]="l.id_laboratory">{{ l.name }}</option>
          </select>
        </div>
        <div class="form-group">
          <label>Forma Farmacéutica</label>
          <select name="id_pharmaceutical_form" [(ngModel)]="currentProduct.id_pharmaceutical_form">
            <option *ngFor="let form of pharmaForms()" [value]="form.id_pharmaceutical_form">{{ form.name }}</option>
          </select>
        </div>
        <div class="form-group">
          <label>Posología</label>
          <select name="id_posology" [(ngModel)]="currentProduct.id_posology">
            <option *ngFor="let p of posologies()" [value]="p.id_posology">{{ p.name }}</option>
          </select>
        </div>
        <div class="form-group full-width">
          <label>Mecanismo de Acción</label>
          <textarea name="action_mechanism" [(ngModel)]="currentProduct.action_mechanism"></textarea>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="cancel-btn" (click)="closeModal()">Cancelar</button>
        <button type="submit" class="save-btn" [disabled]="!productForm.valid">Guardar</button>
      </div>
    </form>
  </div>
</div>
